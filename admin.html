<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Access | Aಲೆ 2026</title><link rel="stylesheet" href="event.css"><style>body{min-height:100vh}#login,#dashboard{max-width:1000px;margin:auto;padding:130px 8vw 70px}.hidden{display:none!important}.notice{color:#bcae96;max-width:680px;line-height:1.7}input,select,button{background:#080808cc;border:1px solid #6d5128;color:#fff;padding:14px;font:14px Poppins}button{background:#d39a38;color:#100a03;border:0;font-weight:700;letter-spacing:1px;cursor:pointer}.tools{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}table{border-collapse:collapse;width:100%;background:#080808bb}th,td{border-bottom:1px solid #3b2d19;padding:14px;text-align:left;font-size:13px}th{color:#e8b75c;text-transform:uppercase;letter-spacing:1px;font-size:10px}#empty{color:#bcae96;padding:25px 0}</style></head>
<body><canvas id="scene"></canvas><div class="shade"></div><header><a href="index.html">← WEBSITE</a><b>Aಲೆ <span>2026</span></b></header><section id="login"><div class="live">OWNER ACCESS</div><h1>Team dashboard</h1><p class="notice">View registrations by event. Enter the owner passcode to unlock this local dashboard.</p><form id="loginForm"><input id="passcode" required type="password" placeholder="Owner passcode" aria-label="Owner passcode"><button type="submit">UNLOCK DASHBOARD</button></form><p id="loginError"></p></section><section id="dashboard" class="hidden"><div class="live">AUTHORIZED VIEW</div><h1>Registered teams</h1><div class="tools"><select id="eventFilter" aria-label="Filter by event"><option value="">All events</option></select><button id="refresh" type="button">REFRESH LIST</button><button id="export" type="button">DOWNLOAD CSV</button><button id="lock" type="button">LOCK</button></div><p id="empty"></p><table id="table" class="hidden"><thead><tr><th>Event</th><th>Team / participant</th><th>Contact</th><th>College</th><th>Registered</th></tr></thead><tbody id="registrations"></tbody></table></section><script>const STORAGE_KEY='kurukshetraRegistrationsV1',OWNER_PASSCODE='CHANGE-THIS-OWNER-PASSCODE';const byId=id=>document.getElementById(id);const login=byId('login'),dashboard=byId('dashboard'),filter=byId('eventFilter'),tbody=byId('registrations'),table=byId('table'),empty=byId('empty');function registrations(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch{return[]}}function escapeHtml(value){const node=document.createElement('span');node.textContent=value||'—';return node.innerHTML}function populateFilter(){const current=filter.value,events=[...new Set(registrations().map(r=>r.event))].sort();filter.innerHTML='<option value="">All events</option>'+events.map(event=>'<option value="'+escapeHtml(event)+'">'+escapeHtml(event)+'</option>').join('');filter.value=events.includes(current)?current:''}function render(){const selected=filter.value,items=registrations().filter(item=>!selected||item.event===selected);tbody.innerHTML=items.map(item=>'<tr><td>'+escapeHtml(item.event)+'</td><td>'+escapeHtml(item.team||item.name)+'</td><td>'+escapeHtml(item.email)+'</td><td>'+escapeHtml(item.college)+'</td><td>'+new Date(item.createdAt).toLocaleString()+'</td></tr>').join('');table.classList.toggle('hidden',items.length===0);empty.textContent=items.length?'': 'No registrations have been received yet.'}function refresh(){populateFilter();render()}function unlock(){login.classList.add('hidden');dashboard.classList.remove('hidden');refresh()}byId('loginForm').addEventListener('submit',event=>{event.preventDefault();if(byId('passcode').value===OWNER_PASSCODE){sessionStorage.setItem('kurukshetraOwnerAccess','yes');unlock()}else byId('loginError').textContent='Incorrect owner passcode.'});if(sessionStorage.getItem('kurukshetraOwnerAccess')==='yes')unlock();filter.addEventListener('change',render);byId('refresh').addEventListener('click',refresh);window.addEventListener('storage',event=>{if(event.key===STORAGE_KEY&&sessionStorage.getItem('kurukshetraOwnerAccess')==='yes')refresh()});byId('lock').addEventListener('click',()=>{sessionStorage.removeItem('kurukshetraOwnerAccess');location.reload()});byId('export').addEventListener('click',()=>{const fields=['event','name','email','college','team','createdAt'],csv=[fields.join(','),...registrations().map(item=>fields.map(field=>'"'+String(item[field]||'').replaceAll('"','""')+'"').join(','))].join('\n'),link=document.createElement('a');link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));link.download='kurukshetra-registrations.csv';link.click();URL.revokeObjectURL(link.href)});</script><script src="effects.js"></script></body></html>
