<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | Aಲೆ 2026</title><link rel="stylesheet" href="event.css"><style>.registration-page{width:min(100%,940px);min-height:100vh;margin:auto;padding:130px 8vw 72px}.registration-page #intro{max-width:540px;margin:0 0 30px;font-size:15px}.registration-page h1{font-size:clamp(42px,7vw,88px)}#registrationForm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:720px;padding:26px;background:rgba(8,8,8,.68);border:1px solid rgba(211,154,56,.28)}#registrationForm input{width:100%;min-height:52px;background:#080808cc;border:1px solid #6d5128;color:#fff;padding:15px 16px;font:14px Poppins}#registrationForm input:focus{outline:1px solid #e1ae58;border-color:#e1ae58}#registrationForm button{grid-column:1/-1;min-height:48px;justify-self:start;border:0;background:#d39a38;color:#100a03;padding:14px 23px;font:700 10px Poppins;letter-spacing:2px;cursor:pointer}#confirmation{max-width:720px;margin-top:17px;color:#ffe1a0;font-weight:600;line-height:1.5}@media(max-width:700px){.registration-page{width:100%;padding:108px 24px 50px}.registration-page h1{font-size:15vw}#registrationForm{grid-template-columns:1fr;padding:18px}#registrationForm button{width:100%;justify-self:stretch}}</style></head>
<body><canvas id="scene"></canvas><div class="shade"></div><header><a id="back" href="index.html#events">← EVENT PAGE</a><b>Aಲೆ <span>2026</span></b></header><main class="registration-page"><div class="live">EVENT REGISTRATION</div><div id="cat">Aಲೆ 2026</div><h1 id="eventName">Register</h1><p id="intro">Reserve your place in the arena.</p><form id="registrationForm"><input id="registrant" name="registrant" required placeholder="Your name" aria-label="Your name"><input id="email" name="email" required type="email" placeholder="Email address" aria-label="Email address"><input id="college" name="college" required placeholder="College / institution" aria-label="College or institution"><input id="team" name="team" placeholder="Team name (if applicable)" aria-label="Team name"><button type="submit">SUBMIT REGISTRATION</button></form><p id="confirmation" aria-live="polite"></p></main>
<script>const STORAGE_KEY='kurukshetraRegistrationsV1';const eventName=new URLSearchParams(location.search).get('event')||'ALE Event';const form=document.getElementById('registrationForm');const message=document.getElementById('confirmation');document.title='Register for '+eventName+' | Aಲೆ 2026';document.getElementById('eventName').textContent=eventName;document.getElementById('intro').textContent='Register for '+eventName+' and bring your best to the arena.';document.getElementById('back').href='event.html?event='+encodeURIComponent(eventName);function readRegistrations(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch{return[]}}form.addEventListener('submit',function(event){event.preventDefault();const registration={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),event:eventName,name:document.getElementById('registrant').value.trim(),email:document.getElementById('email').value.trim(),college:document.getElementById('college').value.trim(),team:document.getElementById('team').value.trim(),createdAt:new Date().toISOString()};const registrations=readRegistrations();registrations.push(registration);localStorage.setItem(STORAGE_KEY,JSON.stringify(registrations));form.reset();message.textContent='Thank you — your registration has been submitted.';})</script>
<script src="effects.js"></script></body></html>
